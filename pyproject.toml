[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepind"
version = "1.4.0"
description = "DAE-ELM - Chemical Formula Optimization System"
readme = "docs/README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "DeepInd Team"}
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "xgboost>=1.5.0",
    "PyYAML>=6.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
gui = [
    "PyQt5>=5.15.0",
]

[project.scripts]
daeelm = "src.cli:main"

[project.urls]
homepage = "https://github.com/deepind/dae-elm"
documentation = "docs/README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "daeelm_agents*", "bridge*", "skill_hub*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
src = ["*.yaml", "*.yml"]