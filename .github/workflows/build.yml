name: Build Windows Executable

on:
  push:
    branches: [ master, main, ai-rebuild, DAE-ELM ]
  pull_request:
    branches: [ master, main, ai-rebuild, DAE-ELM ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Debug git access
        run: |
          echo "Testing repository access..."
          git clone --depth=1 https://github.com/me-speaker/WeCanDo.git test-repo 2>&1
          if (Test-Path test-repo) {
            echo "Clone succeeded"
            Remove-Item -Recurse -Force test-repo
          }

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller pyqt5 torch numpy pandas scipy scikit-learn xgboost matplotlib pyyaml

      - name: Build GUI executable
        run: |
          pyinstaller deepind.spec --noconfirm

      - name: Build CLI executable
        run: |
          pyinstaller deepind_cli.spec --noconfirm

      - name: Upload GUI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepind-gui-windows
          path: dist/deepind
          retention-days: 30

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepind-cli-windows
          path: dist/deepind
          retention-days: 30
